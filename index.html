"L\u2019embarquement commence porte 13."),Q.short("q3","Why is the flight delayed? (one or two words)",["bad weather","weather","the weather","because of bad weather","due to bad weather","because of the weather"],"bad weather","\xC9coute la derni\xE8re phrase : \xAB\xA0\u2026which is due to \u2026\xA0\xBB.","\xAB\xA0We apologise for the short delay, which is due to bad weather in Scotland.\xA0\xBB",{keywords:["weather"],fr:"Pourquoi le vol est-il retard\xE9 ? (un ou deux mots)"})]},{title:"Planning a weekend trip",kind:"audio",skill:"listening",minutes:10,content:{heading:"Listen and answer",instructions:"Listen to the audio and choose the correct answer.",lang:"en-GB",image:hn.london,imageAlt:"Palais de Westminster et Big Ben au bord de la Tamise",dialogue:[{speaker:"Emma",voice:"a",text:"Hi Tom! Have you decided where we\u2019re going for the long weekend?",fr:"Salut Tom ! Tu as d\xE9cid\xE9 o\xF9 on part pour le long week-end ?"},{speaker:"Tom",voice:"b",text:"I think so. What about Edinburgh? We could take the train on Friday morning.",fr:"Je crois que oui. Que dirais-tu d\u2019\xC9dimbourg ? On pourrait prendre le train vendredi matin."},{speaker:"Emma",voice:"a",text:"Great idea! How long is the journey from London?",fr:"Bonne id\xE9e ! Combien de temps dure le trajet depuis Londres ?"},{speaker:"Tom",voice:"b",text:"About four and a half hours. And if we book today, the tickets are much cheaper.",fr:"Environ quatre heures et demie. Et si on r\xE9serve aujourd\u2019hui, les billets sont bien moins chers."},{speaker:"Emma",voice:"a",text:"Perfect. I\u2019ll look for a small hotel near the castle.",fr:"Parfait. Je vais chercher un petit h\xF4tel pr\xE8s du ch\xE2teau."},{speaker:"Tom",voice:"b",text:"Good. The Saturday museum tour fills up quickly, so let\u2019s book it tonight.",fr:"Bien. La visite du mus\xE9e du samedi est vite compl\xE8te, alors r\xE9servons-la ce soir."}],keyPoints:["Long weekend, journey, to book, to fill up : le vocabulaire du voyage","\xAB\xA0How long is the journey?\xA0\xBB sert \xE0 demander la dur\xE9e d\u2019un trajet","\xAB\xA0I\u2019ll + verbe\xA0\xBB exprime une d\xE9cision prise au moment o\xF9 l\u2019on parle"],vocab:[{term:"journey",fr:"trajet, voyage",ex:"How long is the journey from London?"},{term:"to book",fr:"r\xE9server",ex:"If we book today, the tickets are cheaper."},{term:"to fill up",fr:"se remplir, \xEAtre vite complet",ex:"The museum tour fills up quickly."},{term:"long weekend",fr:"pont, week-end prolong\xE9",ex:"Where are we going for the long weekend?"}]},questions:[Q.mcq("q1","What is the main topic of the conversation?",["A travel plan","A job interview","A restaurant","A school project"],0,"Demande-toi ce qu\u2019Emma et Tom organisent ensemble pour le week-end.","Emma et Tom organisent un long week-end \xE0 \xC9dimbourg : transport, h\xF4tel et visite de mus\xE9e. C\u2019est un projet de voyage.","Quel est le sujet principal de la conversation ?"),Q.tf("q2","The train journey from London to Edinburgh takes about four and a half hours.",!0,"\xC9coute la r\xE9ponse de Tom \xE0 la question \xAB\xA0How long is the journey?\xA0\xBB.","Tom r\xE9pond \xAB\xA0About four and a half hours\xA0\xBB, soit environ 4 h 30.","Le trajet en train de Londres \xE0 \xC9dimbourg dure environ quatre heures et demie."),Q.short("q3","When will they book the museum tour? (one word)",["tonight","this evening","tonight they will book it"],"tonight","\xC9coute la derni\xE8re phrase de Tom : \xAB\xA0\u2026so let\u2019s book it \u2026\xA0\xBB.","Tom dit \xAB\xA0let\u2019s book it tonight\xA0\xBB, car la visite du samedi est vite compl\xE8te.",{keywords:["tonight"],placeholder:"\xC9cris ta r\xE9ponse en anglais",fr:"Quand vont-ils r\xE9server la visite du mus\xE9e ? (un mot)"})]},{title:"London landmarks",kind:"video",skill:"listening",minutes:8,content:{heading:"Watch and answer",instructions:"Watch the video with captions, then answer the questions.",lang:"en-GB",video:{src:hn.video,webm:"assets/media/lesson_video.webm",poster:hn.poster,captions:[{start:0,end:5.5,text:"Welcome to London! Let\u2019s learn some words to describe famous places."},{start:5.5,end:12,text:"This tall clock tower is Big Ben. It is one of London\u2019s most famous landmarks."},{start:12,end:18,text:"Westminster Bridge crosses the River Thames."},{start:18,end:24,text:"The Houses of Parliament stand right next to the river."}]},keyPoints:["A landmark : un lieu ou monument c\xE9l\xE8bre, facile \xE0 reconna\xEEtre","To cross : traverser \xB7 next to : \xE0 c\xF4t\xE9 de","Clock tower : tour de l\u2019horloge"],vocab:[{term:"landmark",fr:"monument, lieu embl\xE9matique",ex:"Big Ben is a famous landmark."},{term:"to cross",fr:"traverser",ex:"Westminster Bridge crosses the River Thames."},{term:"next to",fr:"\xE0 c\xF4t\xE9 de",ex:"Parliament stands right next to the river."},{term:"clock tower",fr:"tour de l\u2019horloge",ex:"This tall clock tower is Big Ben."}]},questions:[Q.mcq("q1","In the video, what is a \u201Clandmark\u201D?",["A famous building or place that is easy to recognise","A map of the city","A type of bridge","A tourist ticket"],0,"Big Ben est pr\xE9sent\xE9 comme \xAB\xA0one of London\u2019s most famous \u2026\xA0\xBB.","A landmark est un lieu ou monument tr\xE8s connu, comme Big Ben.","Dans la vid\xE9o, qu\u2019est-ce qu\u2019un \xAB\xA0landmark\xA0\xBB ?"),Q.mcq("q2","What does Westminster Bridge cross?",["The River Thames","The Seine","A canal","A motorway"],0,"Regarde le troisi\xE8me sous-titre.","\xAB\xA0Westminster Bridge crosses the River Thames.\xA0\xBB","Que traverse le pont de Westminster ?"),Q.tf("q3","The Houses of Parliament are far from the river.",!1,"\xC9coute la derni\xE8re phrase : \xAB\xA0right next to \u2026\xA0\xBB.","Ils se trouvent \xAB\xA0right next to the river\xA0\xBB, juste au bord de la Tamise.","Le Parlement est loin du fleuve.")]},{title:"A postcard from Edinburgh",kind:"reading",skill:"reading",minutes:10,content:{heading:"Read and answer",instructions:"Read Emma\u2019s postcard and answer the questions.",lang:"en-GB",reading:{title:"Dear Grandma,",paragraphs:["Greetings from Edinburgh! Tom and I arrived on Friday afternoon after a long but beautiful train journey along the coast.","Our hotel is tiny, but it\u2019s only five minutes from the castle, so we walked there first thing on Saturday morning. The view over the city was amazing, even in the rain.","In the afternoon we took the museum tour we had booked. Our guide was funny and explained the history of the old town. I bought you a small book about Scottish castles.","We\u2019re taking the train back on Monday. See you soon! Love, Emma"]},keyPoints:["First thing in the morning : \xE0 la premi\xE8re heure","Even in the rain : m\xEAme sous la pluie","Le pr\xE9t\xE9rit (arrived, walked, took, bought) raconte le s\xE9jour"],vocab:[{term:"first thing",fr:"\xE0 la premi\xE8re heure",ex:"We walked there first thing on Saturday."},{term:"even in the rain",fr:"m\xEAme sous la pluie",ex:"The view was amazing, even in the rain."},{term:"tiny",fr:"minuscule",ex:"Our hotel is tiny."},{term:"to take the train back",fr:"rentrer en train",ex:"We\u2019re taking the train back on Monday."}]},questions:[Q.mcq("q1","How did Emma and Tom travel to Edinburgh?",["By train","By plane","By car","By bus"],0,"Relis la premi\xE8re phrase de la carte.","\xAB\xA0\u2026after a long but beautiful train journey along the coast.\xA0\xBB","Comment Emma et Tom sont-ils all\xE9s \xE0 \xC9dimbourg ?"),Q.tf("q2","It was sunny when they visited the castle.",!1,"Cherche la phrase qui parle de la vue sur la ville.","La vue \xE9tait magnifique \xAB\xA0even in the rain\xA0\xBB : il pleuvait.","Il faisait beau quand ils ont visit\xE9 le ch\xE2teau."),Q.short("q3","What did Emma buy for her grandmother? (2\u20133 words)",["a book","a small book","book","small book","a small book about scottish castles","a book about scottish castles","a book about castles"],"a small book (about Scottish castles)","Cherche le verbe \xAB\xA0bought\xA0\xBB.","\xAB\xA0I bought you a small book about Scottish castles.\xA0\xBB",{keywords:["book"],fr:"Qu\u2019a achet\xE9 Emma pour sa grand-m\xE8re ? (2 ou 3 mots)"})]},{title:"\xC9valuation du module 4",kind:"assessment",skill:"listening",minutes:15,passMark:.7,content:{heading:"Module assessment",instructions:"Listen to the conversation at the hotel reception, then answer the five questions. You need 70 % to validate the module.",lang:"en-GB",dialogue:[{speaker:"Receptionist",voice:"b",text:"Good evening, welcome to the Royal Mile Hotel. How can I help you?",fr:"Bonsoir, bienvenue au Royal Mile Hotel. Que puis-je faire pour vous ?"},{speaker:"Emma",voice:"a",text:"Hello, we have a reservation for two nights. The name is Emma Clarke.",fr:"Bonjour, nous avons une r\xE9servation pour deux nuits. Au nom d\u2019Emma Clarke."},{speaker:"Receptionist",voice:"b",text:"Thank you, Ms Clarke. You\u2019re in room two one four, on the second floor. Breakfast is served from seven to ten.",fr:"Merci, madame Clarke. Vous \xEAtes chambre deux cent quatorze, au deuxi\xE8me \xE9tage. Le petit-d\xE9jeuner est servi de sept \xE0 dix heures."},{speaker:"Emma",voice:"a",text:"Lovely. Is there a lift?",fr:"Parfait. Y a-t-il un ascenseur ?"},{speaker:"Receptionist",voice:"b",text:"Yes, just behind you, next to the stairs. And here\u2019s a map of the old town.",fr:"Oui, juste derri\xE8re vous, \xE0 c\xF4t\xE9 de l\u2019escalier. Et voici un plan de la vieille ville."}],keyPoints:["Reservation, floor, lift : le vocabulaire de l\u2019h\xF4tel","Les nombres de chambre se lisent chiffre par chiffre : two one four","\xAB\xA0From seven to ten\xA0\xBB indique une plage horaire"],vocab:[{term:"reservation",fr:"r\xE9servation",ex:"We have a reservation for two nights."},{term:"floor",fr:"\xE9tage",ex:"Your room is on the second floor."},{term:"lift",fr:"ascenseur (GB)",ex:"Is there a lift?"},{term:"stairs",fr:"escalier",ex:"The lift is next to the stairs."}]},questions:[Q.mcq("q1","How many nights will Emma stay?",["One","Two","Three","Four"],1,"\xC9coute la premi\xE8re r\xE9plique d\u2019Emma.","\xAB\xA0We have a reservation for two nights.\xA0\xBB","Combien de nuits Emma va-t-elle rester ?"),Q.short("q2","What is Emma\u2019s room number? (digits)",["214","two one four","two hundred and fourteen"],"214","Le num\xE9ro est lu chiffre par chiffre.","\xAB\xA0You\u2019re in room two one four\xA0\xBB : chambre 214.",{fr:"Quel est le num\xE9ro de chambre d\u2019Emma ? (en chiffres)"}),Q.tf("q3","Breakfast is served until eleven.",!1,"\xC9coute la plage horaire du petit-d\xE9jeuner.","Le petit-d\xE9jeuner est servi \xAB\xA0from seven to ten\xA0\xBB, de 7 h \xE0 10 h.","Le petit-d\xE9jeuner est servi jusqu\u2019\xE0 onze heures."),Q.mcq("q4","Where is the lift?",["Behind Emma, next to the stairs","On the second floor","Next to the restaurant","There is no lift"],0,"\xC9coute la r\xE9ponse \xE0 \xAB\xA0Is there a lift?\xA0\xBB.","\xAB\xA0Yes, just behind you, next to the stairs.\xA0\xBB","O\xF9 se trouve l\u2019ascenseur ?"),Q.mcq("q5","In this module, what does \u201Cto book\u201D mean?",["R\xE9server","Lire","Annuler","Payer"],0,"Pense \xE0 \xAB\xA0book the tickets\xA0\xBB dans la le\xE7on 2.","\xAB\xA0To book\xA0\xBB signifie r\xE9server : to book a ticket, to book a tour.","Dans ce module, que signifie \xAB\xA0to book\xA0\xBB ?")]}],[{label:"Comprendre une conversation de voyage",lessons:[1,2,3]},{label:"Rep\xE9rer des informations cl\xE9s",lessons:[4,5]}]),Se(Qt,5,"Exprimer son opinion",[{title:"Agreeing and disagreeing",kind:"practice",skill:"speaking",minutes:10,content:{heading:"Choose the right expression",instructions:"Read the useful expressions, then choose the most natural answer for each situation.",lang:"en-GB",reading:{title:"Useful expressions",paragraphs:["To agree: \u201CI totally agree.\u201D \xB7 \u201CThat\u2019s a good point.\u201D \xB7 \u201CExactly!\u201D","To partly agree: \u201CI see what you mean, but\u2026\u201D \xB7 \u201CThat\u2019s true, however\u2026\u201D","To disagree politely: \u201CI\u2019m not so sure about that.\u201D \xB7 \u201CI see it differently.\u201D"]},keyPoints:["Accord total : I totally agree / Exactly","Accord partiel : I see what you mean, but\u2026","D\xE9saccord poli : I\u2019m not so sure about that"],vocab:[{term:"I totally agree",fr:"je suis tout \xE0 fait d\u2019accord",ex:"I totally agree, remote work saves time."},{term:"I see what you mean, but\u2026",fr:"je vois ce que tu veux dire, mais\u2026",ex:"I see what you mean, but it\u2019s expensive."},{term:"I\u2019m not so sure about that",fr:"je n\u2019en suis pas si s\xFBr",ex:"I\u2019m not so sure about that idea."}]},questions:[Q.mcq("q1","Your colleague says: \u201CRemote work saves a lot of time.\u201D You fully agree. What do you say?",["I totally agree.","I\u2019m not so sure about that.","I see it differently.","That\u2019s true, however\u2026"],0,"Cherche l\u2019expression d\u2019accord total.","\xAB\xA0I totally agree\xA0\xBB exprime un accord complet.","Ton coll\xE8gue dit que le t\xE9l\xE9travail fait gagner beaucoup de temps. Tu es enti\xE8rement d\u2019accord : que r\xE9ponds-tu ?"),Q.mcq("q2","Which sentence is a polite way to disagree?",["I\u2019m not so sure about that.","You\u2019re wrong.","No way.","That\u2019s stupid."],0,"Le d\xE9saccord poli reste nuanc\xE9.","\xAB\xA0I\u2019m not so sure about that\xA0\xBB exprime un d\xE9saccord sans brusquer l\u2019autre.","Quelle phrase permet d\u2019exprimer poliment un d\xE9saccord ?"),Q.tf("q3","\u201CI see what you mean, but\u2026\u201D shows partial agreement.",!0,"Le \xAB\xA0but\xA0\xBB annonce une r\xE9serve.","On reconna\xEEt le point de vue de l\u2019autre avant d\u2019apporter une nuance : c\u2019est un accord partiel.","\xAB\xA0I see what you mean, but\u2026\xA0\xBB exprime un accord partiel.")]},{title:"Giving reasons",skill:"grammar",kind:"practice"},{title:"Debate: city or countryside?",skill:"listening",kind:"audio"},{title:"\xC9valuation du module 5",skill:"speaking",kind:"assessment",minutes:15}],[{label:"Donner son avis",lessons:[1,2]},{label:"Nuancer et argumenter",lessons:[3,4]}]),Se(Qt,6,"Projet final",[{title:"Preparing a short talk",skill:"speaking",kind:"practice"},{title:"Useful phrases for presentations",skill:"vocabulary"},{title:"Pr\xE9sentation finale",skill:"speaking",kind:"assessment",minutes:20}],[{label:"Pr\xE9parer une pr\xE9sentation",lessons:[1,2]},{label:"Pr\xE9senter \xE0 l\u2019oral",lessons:[3]}])]},ot=[{id:"en-b1-review-irregular",courseId:Qt,moduleId:"en-b1-review",index:1,title:"R\xE9vision express : verbes irr\xE9guliers",kind:"practice",skill:"grammar",minutes:6,content:{heading:"Quick review",instructions:"Write the past simple form of each verb, then choose the correct sentence.",lang:"en-GB",reading:{title:"Rappel",paragraphs:["Les verbes irr\xE9guliers ne prennent pas -ed au pr\xE9t\xE9rit : go \u2192 went, buy \u2192 bought, take \u2192 took, see \u2192 saw.","Astuce : apprends-les par familles de sons (buy / bought, bring / brought, think / thought)."]},keyPoints:["go \u2192 went \xB7 buy \u2192 bought \xB7 take \u2192 took","Au pr\xE9t\xE9rit, la forme est la m\xEAme \xE0 toutes les personnes"],vocab:[{term:"go \u2192 went",fr:"aller",ex:"I went to Edinburgh."},{term:"buy \u2192 bought",fr:"acheter",ex:"I bought a book."},{term:"take \u2192 took",fr:"prendre",ex:"We took the train."},{term:"see \u2192 saw",fr:"voir",ex:"We saw the castle."}]},questions:[Q.short("q1","go \u2192 ?",["went"],"went","Ce verbe change compl\xE8tement au pr\xE9t\xE9rit.","go \u2192 went (I went to Edinburgh).",{placeholder:"Pr\xE9t\xE9rit de \xAB\xA0go\xA0\xBB"}),Q.short("q2","buy \u2192 ?",["bought"],"bought","M\xEAme famille de sons que \xAB\xA0think \u2192 thought\xA0\xBB.","buy \u2192 bought (I bought a book).",{placeholder:"Pr\xE9t\xE9rit de \xAB\xA0buy\xA0\xBB"}),Q.short("q3","take \u2192 ?",["took"],"took","Comme \xAB\xA0shake \u2192 shook\xA0\xBB.","ta
